
name: Preflight-CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML

      - name: Verify Python imports
        run: |
          python --version
          python -c "import yaml; print('PyYAML import OK')"

      - name: Run Preflight-CI analysis
        run: python -m src.ci_report

      - name: Upload Preflight-CI report
        if: always() && hashFiles('reports/preflight_report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: preflight-ci-report
          path: reports/preflight_report.json
          retention-days: 14

      - name: Post Preflight-CI report on pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('reports/preflight_report.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(
              fs.readFileSync('reports/preflight_report.json', 'utf8')
            );

            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull request found; skipping comment.');
              return;
            }

            const summary = report.summary || {};
            const apiFindings =
              (report.api_contract && report.api_contract.findings) || [];
            const apiReviewItems =
              (report.api_contract && report.api_contract.review_items) || [];
            const complianceFindings =
              report.compliance_findings || [];
            const errors = report.analysis_errors || [];
            const impact = report.downstream_impact || {};
            const affectedServices = impact.affected_services || [];
            const dependencyEdges = impact.dependency_edges || [];

            const impactLines = [];

            if (impact.changed_services && impact.changed_services.length) {
              impactLines.push(
                `**Changed services:** ${impact.changed_services.join(', ')}`
              );
            }

            if (affectedServices.length) {
              for (const item of affectedServices) {
                const consumers = item.affected_consumers || [];
                impactLines.push(
                  `- **${item.changed_service}** may affect: ${
                    consumers.length ? consumers.join(', ') : 'No known consumers'
                  }`
                );

                const evidence = item.evidence || [];
                for (const edge of evidence) {
                  impactLines.push(
                    `  - Evidence: \`${edge.method} ${edge.path}\` ` +
                    `from **${edge.source}** ` +
                    `(\`${edge.file || 'unknown file'}:${edge.line || '?'}\`)`
                  );
                }
              }
            } else if (impact.status === 'no_known_consumers') {
              impactLines.push(
                'No downstream consumers were identified by the configured static scan.'
              );
            } else if (impact.status === 'unknown') {
              impactLines.push(
                'Impact could not be determined. Review the service map and analysis errors.'
              );
            } else {
              impactLines.push(
                'No affected consumers were reported for this change.'
              );
            }

            impactLines.push(
              `**Analysis status:** ${impact.status || 'unknown'}`
            );

            if (impact.reason) {
              impactLines.push(`**Details:** ${impact.reason}`);
            }

            const lines = [
              '<!-- preflight-ci-report -->',
              '## Preflight-CI Risk Report',
              '',
              `**Mode:** ${report.mode || 'unknown'}`,
              `**Risk level:** ${
                summary.impact_risk_level ||
                (summary.contract_findings > 0 ? 'HIGH' : 'REVIEW')
              }`,
              `**Human review required:** ${
                summary.human_review_required ? 'Yes' : 'No'
              }`,
              '',
              '### API contract findings',
              apiFindings.length
                ? apiFindings.map(f =>
                    `- **${f.severity || 'REVIEW'} — ${f.type || 'Finding'}:** ${f.message || 'Details unavailable'}`
                  ).join('\n')
                : '- No API breaking-change findings reported.',
              '',
              '### API specifications requiring review',
              apiReviewItems.length
                ? apiReviewItems.map(f =>
                    `- **${f.type || 'Review item'}:** ${f.path || 'Unknown file'} — ${f.message || 'Manual review required'}`
                  ).join('\n')
                : '- No additional API specification review items.',
              '',
              '### Downstream service impact',
              ...impactLines,
              '',
              '### Compliance review',
              complianceFindings.length
                ? complianceFindings.map(f =>
                    `- **${f.severity || 'REVIEW'} — ${f.rule_id || 'Review signal'}**` +
                    ` (${f.file || 'unknown file'}${f.line ? `:${f.line}` : ''})` +
                    `\n  - Evidence: ${f.evidence || 'Not provided'}` +
                    `\n  - Recommendation: ${f.recommendation || 'Manual review'}`
                  ).join('\n')
                : '- No compliance findings reported.',
              '',
              '### Analysis errors',
              errors.length
                ? errors.map(e =>
                    `- ${e.file || 'unknown file'}: ${e.error || 'Unknown error'}`
                  ).join('\n')
                : '- None',
              '',
              '_Downstream impact is estimated from configured service ownership and statically detected HTTP calls. Dynamic dependencies may be missed._',
              '',
              '_Preflight-CI findings are automated review signals, not proof of a compliance violation. Review the evidence before merging._'
            ];

            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = pr.number;

            const existing = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });

            const previous = existing.data.find(comment =>
              comment.user && comment.user.type === 'Bot' &&
              comment.body.includes('<!-- preflight-ci-report -->')
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
              core.info('Updated existing Preflight-CI comment.');
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
              core.info('Posted Preflight-CI comment.');
            }
