
name: Preflight-CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install PyYAML

      - name: Run Preflight-CI analysis
        run: python -m src.ci_report

      - name: Upload Preflight-CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-ci-report
          path: reports/preflight_report.json
          if-no-files-found: warn
          retention-days: 14
